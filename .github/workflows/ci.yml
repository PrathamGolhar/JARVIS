name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Backend — Python tests
  # ─────────────────────────────────────────────
  backend-tests:
    name: Backend (Python 3.11 / pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install runtime + test dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend test suite
        env:
          JARVIS_ENV: test
          JARVIS_AI_PROVIDER: local
          JARVIS_PERMISSION_MODE: assisted
        working-directory: backend
        run: python -m pytest -v --tb=short

  # ─────────────────────────────────────────────
  # Job 2: Frontend — TypeScript check + build
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend (Node 20 / Vite build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: jarvis-frontend/package-lock.json

      - name: Install dependencies (frozen lockfile)
        working-directory: jarvis-frontend
        run: npm ci

      - name: TypeScript check + production build
        working-directory: jarvis-frontend
        run: npm run build

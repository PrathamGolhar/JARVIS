services:
  jarvis-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-ai-assistant
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - JARVIS_ENV=production
      - JARVIS_HOST=0.0.0.0
      - JARVIS_PORT=8765
      - JARVIS_AI_PROVIDER=${JARVIS_AI_PROVIDER:-auto}
      - JARVIS_GEMINI_API_KEY=${JARVIS_GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      - JARVIS_GEMINI_MODEL=${JARVIS_GEMINI_MODEL:-gemini-2.5-flash}
      - JARVIS_GROQ_API_KEY=${JARVIS_GROQ_API_KEY:-${GROQ_API_KEY:-}}
      - JARVIS_GROQ_MODEL=${JARVIS_GROQ_MODEL:-openai/gpt-oss-120b}
      - JARVIS_GROQ_FALLBACK_MODEL=${JARVIS_GROQ_FALLBACK_MODEL:-openai/gpt-oss-20b}
      - JARVIS_OPENAI_API_KEY=${JARVIS_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      - JARVIS_OPENAI_MODEL=${JARVIS_OPENAI_MODEL:-gpt-4o}
      - JARVIS_ANTHROPIC_API_KEY=${JARVIS_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}
      - JARVIS_ANTHROPIC_MODEL=${JARVIS_ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - JARVIS_ELEVENLABS_API_KEY=${JARVIS_ELEVENLABS_API_KEY:-${ELEVENLABS_API_KEY:-}}
      - JARVIS_STT_PROVIDER=${JARVIS_STT_PROVIDER:-groq-whisper}
      - JARVIS_TTS_PROVIDER=${JARVIS_TTS_PROVIDER:-edge-tts}
      - EDGE_TTS_VOICE=${EDGE_TTS_VOICE:-en-US-GuyNeural}
      - JARVIS_DATABASE_URL=sqlite:////app/data/jarvis_memory.db
      - JARVIS_PERMISSION_MODE=${JARVIS_PERMISSION_MODE:-assisted}
      - JARVIS_SANDBOX_TIMEOUT=${JARVIS_SANDBOX_TIMEOUT:-15}
      - JARVIS_LOCAL_ACTIONS_ENABLED=false
      - JARVIS_ALLOWED_ORIGINS=http://localhost:1420,http://localhost:5173,http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - jarvis-data:/app/data

  jarvis-frontend-dev:
    image: node:20-alpine
    container_name: jarvis-frontend-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "1420:1420"
    volumes:
      - ./jarvis-frontend:/app
      - /app/node_modules
    environment:
      - JARVIS_API_PROXY_TARGET=http://jarvis-backend:8765
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev

volumes:
  jarvis-data:
    driver: local
